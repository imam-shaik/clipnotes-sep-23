<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Note Editor</title>
    <link rel="stylesheet" href="panel.css">
    <style>
        :root {
            --glass-bg: rgba(30, 30, 30, 0.85);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent-primary: #3498db;
            --accent-glow: rgba(52, 152, 219, 0.4);
            --bg-card: rgba(45, 45, 45, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: #121212;
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }

        .editor-container {
            display: flex;
            flex-direction: column;
            height: calc(100% - 40px);
            max-width: 1200px;
            margin: 20px auto;
            width: 95%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.02);
        }

        .editor-title {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.01em;
        }

        .editor-toolbar {
            display: flex;
            gap: 10px;
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--glass-border);
            flex-wrap: wrap;
            align-items: center;
        }

        .toolbar-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 42px;
        }

        .toolbar-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .toolbar-btn.list-style-btn svg {
            transition: transform 0.2s;
        }
        
        .toolbar-btn.list-style-btn:hover svg {
            transform: scale(1.1);
        }

        .editor-content {
            flex: 1;
            padding: 40px;
            font-size: 16px;
            line-height: 1.8;
            outline: none;
            overflow-y: auto;
            color: #fff;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
        }

        .editor-content:empty:before {
            content: attr(placeholder);
            color: #555;
            font-style: italic;
        }

        .editor-footer {
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            padding: 20px 30px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid var(--glass-border);
        }

        .btn {
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #bbb;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background: var(--accent-primary);
            border: none;
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-primary:hover {
            filter: brightness(1.15);
            transform: translateY(-1px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .divider {
            width: 1px;
            height: 24px;
            background: rgba(255, 255, 255, 0.1);
            margin: 0 4px;
        }

        @media (max-width: 768px) {
            .editor-container {
                width: 100%;
                height: 100%;
                margin: 0;
                border-radius: 0;
            }
        }
    </style>
</head>

<body data-theme="dark">
    <div class="editor-container">
        <header class="editor-header">
            <div class="editor-title">
                <span>📝</span> Edit Note
            </div>
            <div id="video-info" style="font-size: 13px; color: var(--text-muted);"></div>
        </header>

        <div class="editor-toolbar" id="toolbar">
            <button class="toolbar-btn" data-cmd="bold" title="Bold"><strong>B</strong></button>
            <button class="toolbar-btn" data-cmd="italic" title="Italic"><em>I</em></button>
            <button class="toolbar-btn" data-cmd="underline" title="Underline"><u>U</u></button>
            <div style="width: 1px; background: var(--border-color); margin: 0 4px;"></div>
            <button class="toolbar-btn" data-cmd="insertUnorderedList" title="Bullet List">&bull; List</button>
            <button class="toolbar-btn" data-cmd="insertOrderedList" title="Numbered List">1. List</button>
            <div style="width: 1px; background: var(--border-color); margin: 0 4px;"></div>
            <button class="toolbar-btn list-style-btn" data-marker="→" title="Arrow List">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
            <button class="toolbar-btn list-style-btn" data-marker="✓" title="Check List">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </button>
            <div style="width: 1px; background: var(--border-color); margin: 0 4px;"></div>
            <button class="toolbar-btn" data-cmd="formatBlock" data-val="h1">H1</button>
            <button class="toolbar-btn" data-cmd="formatBlock" data-val="h2">H2</button>
            <button class="toolbar-btn" data-cmd="formatBlock" data-val="h3">H3</button>
            <div style="width: 1px; background: var(--border-color); margin: 0 4px;"></div>
            <button class="toolbar-btn" data-cmd="removeFormat" title="Clear Formatting">Clear</button>
        </div>

        <div class="editor-content" id="editor" contenteditable="true"
            placeholder="Start typing your professional notes..."></div>

        <footer class="editor-footer">
            <button class="btn btn-secondary" id="btn-cancel">Cancel</button>
            <button class="btn btn-primary" id="btn-save">Save changes</button>
        </footer>
    </div>

    <!-- Custom Modal Overlay -->
    <div id="custom-prompt-overlay" class="modal-overlay hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 10000; display: flex; align-items: center; justify-content: center;">
        <div class="modal-content" style="background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 30px; border-radius: 16px; width: 400px; box-shadow: 0 30px 60px rgba(0,0,0,0.5); text-align: center;">
            <h3 id="custom-prompt-message" style="margin: 0 0 24px; font-size: 18px; line-height: 1.5;">Prompt Message</h3>
            <div class="modal-actions" style="display: flex; gap: 12px; justify-content: center;">
                <button id="custom-prompt-cancel" class="btn btn-secondary">Cancel</button>
                <button id="custom-prompt-confirm" class="btn btn-primary">OK</button>
            </div>
        </div>
    </div>

    <style>
        .hidden { display: none !important; }
    </style>

    <script src="note-editor-big.js"></script>
</body>

</html>
